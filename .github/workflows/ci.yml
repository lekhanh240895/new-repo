name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Fetches the model and checks every asset against assets.lock.json.
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      # Boots the real camera → worker → model pipeline in headless Chromium on a synthetic dark clip.
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
