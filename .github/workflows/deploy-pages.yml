name: Deploy to GitHub Pages

# Manual only: publishing the app is a deliberate step (Actions → this workflow → Run workflow).
# First enable Pages in the repo: Settings → Pages → Source: GitHub Actions.
#
# Note: GitHub Pages cannot send HTTP headers, so only the page gets the CSP (from a
# <meta> tag); the vision worker does not. Cloudflare Pages reads dist/_headers and
# covers both — see README "Deploy".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
